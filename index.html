    <script>
    (function() {
      const utmParamQueryString = new URLSearchParams(window.location.search);
      if (utmParamQueryString.toString()) {
        function updateLinks() {
          var navLinks = document.querySelectorAll('a');
          navLinks.forEach(function(item) {
            if (item.href.indexOf('https://pay.kiwify.com.br') !== -1) {
              if (item.getAttribute('data-utm-added') === 'true') return;
              if (item.href.indexOf('?') === -1) {
                item.href += '?' + utmParamQueryString.toString();
              } else {
                if (item.href.indexOf(utmParamQueryString.toString()) === -1) {
                  item.href += '&' + utmParamQueryString.toString();
                }
              }
              item.setAttribute('data-utm-added', 'true');
            }
          });
        }
        updateLinks();
        // Watch for dynamically added links by React
        const observer = new MutationObserver(updateLinks);
        observer.observe(document.body, { childList: true, subtree: true });
      }
    })();
    </script>
