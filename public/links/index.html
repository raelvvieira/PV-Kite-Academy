<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>@heinerhofmann | Kite</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;min-height:100vh;background:linear-gradient(180deg,#3ed1c9 0%,#4fe3a0 100%);color:#222;display:flex;justify-content:center;padding:24px 16px 48px}
  .wrap{width:100%;max-width:480px}
  header{text-align:center;margin:16px 0 24px}
  .avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:44px;background:#fff;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.15);overflow:hidden}
  h1{color:#fff;font-size:20px;font-weight:700}
  .bio{color:#fff;opacity:.9;font-size:14px;margin-top:6px}
  .card{display:block;text-decoration:none;color:#444;background:#fff;border:2px solid #000;border-radius:22px;box-shadow:4px 4px 0 #000;margin-bottom:16px;transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000}
  .card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
  .row{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:56px}
  .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex-shrink:0;background:#e9f9f6}
  .label{flex:1;text-align:center;font-size:13px;letter-spacing:.5px;text-transform:uppercase;padding-right:38px}
  .feat{padding:8px}
  .feat .img{width:100%;aspect-ratio:16/10;border-radius:16px;background-size:cover;background-position:center}
  .feat .label{display:block;padding:14px 8px 8px;text-transform:none;font-size:14px}
  .hero{background:linear-gradient(160deg,#bff0ff,#e8fbff);display:grid;place-items:center;font-size:72px}
  .badge{display:inline-block;background:#ff7a00;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:6px;text-transform:uppercase}
  footer{text-align:center;color:#fff;font-size:12px;opacity:.85;margin-top:24px}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="avatar">🪁</div>
    <h1>@heinerhofmann</h1>
    <p class="bio">Instrutor de kitesurf · Aulas, cursos e equipamentos</p>
  </header>

  <a class="card" href="https://tr.ee/eCxXAU8B0Y" target="_blank" rel="noopener">
    <div class="row"><span class="ico">🏖️</span><span class="label">Clínica de Kitesurf — Informações</span></div>
  </a>

  <a class="card feat" href="https://wa.me/5551995464701?text=Ol%C3%A1!%20Quero%20agendar%20uma%20aula%20presencial%20de%20kitesurf." target="_blank" rel="noopener">
    <div class="img hero">🏄‍♂️</div>
    <span class="label"><span class="badge">WhatsApp</span><br>AGENDE SUA AULA PRESENCIAL</span>
  </a>

  <a class="card feat" href="https://kiteacademy.com.br/" target="_blank" rel="noopener">
    <div class="img" style="background-image:url('https://ugc.production.linktr.ee/0ebb0938-a5f0-4a6d-883f-8755bfa72a46_CAPA-CURSO-HEINER-7ccf617c2ff8487cad6fad6dcb5bc24f-4c6e4a6aea4d467aabd31d1418a9bb65.png?io=true&size=thumbnail-feature-v1_0')"></div>
    <span class="label"><span class="badge">Online</span><br>Curso Avançado de Kitesurf | Heiner Hofmann Academy</span>
  </a>

  <a class="card" href="https://wa.me/5551995464701?text=Ol%C3%A1!%20Quero%20saber%20sobre%20equipamentos%20de%20kitesurf." target="_blank" rel="noopener">
    <div class="row"><span class="ico">🪁</span><span class="label">Adquira seus equipamentos</span></div>
  </a>

  <a class="card" href="https://youtube.com/@heinerhofmannkite" target="_blank" rel="noopener">
    <div class="row"><span class="ico">▶️</span><span class="label">YouTube</span></div>
  </a>

  <a class="card" href="https://www.tiktok.com/@heinerhofmannkite" target="_blank" rel="noopener">
    <div class="row"><span class="ico">🎵</span><span class="label">TikTok</span></div>
  </a>

  <footer>© Heiner Hofmann Kite</footer>
</main>
</body>
</html>
